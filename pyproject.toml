[project]
name = "xau-lab"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backtest*", "data*", "primitives*", "setups*", "risk*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]